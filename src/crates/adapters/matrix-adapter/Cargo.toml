[package]
name = "bitfun-matrix-adapter"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "OpenHarmony Matrix skill market adapter for BitFun (protocol translation + skill ZIP install)"

[lib]
path = "src/lib.rs"

[dependencies]
# HTTP client (json + native-tls are the only features this crate relies on,
# but workspace = true inherits the broader workspace feature set).
reqwest = { workspace = true, features = ["json", "native-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt-multi-thread"] }
log = { workspace = true }
thiserror = { workspace = true }
# URL path encoding for Matrix skill enName values that may contain special
# characters (e.g. "KMP CMP" with a space) — see spec.md Edge Cases.
urlencoding = { workspace = true }
# Async stream iteration for bounded response body collection.
futures = { workspace = true }

[lints]
workspace = true
