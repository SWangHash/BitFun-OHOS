<!DOCTYPE html>
<html lang="zh-CN" data-bf-appearance-mode="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="title">JSON 格式化</title>
</head>
<body>
  <div id="app" class="jf">
    <header class="topbar">
      <div class="brand">
        <div class="brand__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/>
            <path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/>
          </svg>
        </div>
        <div class="brand__text">
          <h1 class="brand__title" data-i18n="title">JSON 格式化</h1>
          <p class="brand__subtitle" data-i18n="subtitle">校验 · 美化 · 压缩 · 键排序</p>
        </div>
      </div>
      <div class="topbar__status">
        <span class="status status--ok" id="status-pill" data-i18n="statusReady">就绪</span>
      </div>
    </header>

    <div class="toolbar">
      <div class="toolbar__group" id="indent-group">
        <span class="toolbar__label" data-i18n="indent">缩进</span>
        <button type="button" class="opt" data-indent="2">2</button>
        <button type="button" class="opt" data-indent="4">4</button>
        <button type="button" class="opt" data-indent="tab">Tab</button>
      </div>
      <div class="toolbar__group">
        <button id="btn-format" class="btn btn--primary" type="button"><span data-i18n="format">格式化</span></button>
        <button id="btn-minify" class="btn" type="button"><span data-i18n="minify">压缩</span></button>
        <button id="btn-sort" class="btn" type="button"><span data-i18n="sortKeys">键排序</span></button>
        <button id="btn-validate" class="btn" type="button"><span data-i18n="validate">校验</span></button>
      </div>
    </div>

    <main class="layout">
      <section class="pane">
        <div class="pane__header">
          <div class="card__title">
            <span data-i18n="inputTitle">输入</span>
            <span class="hint" id="input-stats"></span>
          </div>
          <div class="pane__actions">
            <button id="btn-paste-sample" class="link-btn" type="button"><span data-i18n="sample">示例</span></button>
            <button id="btn-clear" class="link-btn" type="button"><span data-i18n="clear">清空</span></button>
          </div>
        </div>
        <div class="editor">
          <textarea id="input" spellcheck="false" autocomplete="off" autocorrect="off"
            data-i18n-attr="placeholder" data-i18n="inputPlaceholder"
            placeholder='把 JSON 粘贴到这里，例如 {"name":"BitFun","ok":true}'></textarea>
        </div>
      </section>

      <section class="pane">
        <div class="pane__header">
          <div class="card__title">
            <span data-i18n="outputTitle">输出</span>
            <span class="hint" id="output-stats"></span>
          </div>
          <div class="pane__actions">
            <button id="btn-copy" class="link-btn" type="button"><span data-i18n="copy">复制</span></button>
            <button id="btn-download" class="link-btn" type="button" hidden><span data-i18n="useOutput">用作输入</span></button>
          </div>
        </div>
        <div class="editor editor--output">
          <pre id="output" class="output" tabindex="0"></pre>
          <div class="empty" id="output-empty" data-i18n="outputEmpty">格式化结果将在这里展示。</div>
          <div class="error-box" id="error-box" hidden></div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
