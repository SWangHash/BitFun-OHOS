# faults/_data/symptoms.yaml — 症状（S）真源
#
# 实体：症状 = 开发者可观察的应用层表现（检索入口，薄记录）。
# 字段规范见 faults/_index.md §五；本文件是单一真源，
# _graph.yaml / _registry.md 由 `python tools/faults-build.py build` 重建，勿手改派生物。
#
# 字段：
#   id          S-XXXX（只增不复用）
#   title       现象一句话（检索锚点，用开发者会说的词）
#   domain      build/deploy/runtime/render/api/input/lifecycle/toolchain/filesystem
#   severity    blocker/critical/high/medium/low
#   status      active（未采取方案仍会遇到）/ mitigated（方案后消失）/ resolved（根因修复后消失）
#   causes      根因边（S→C）；多根因时配 cause_relation
#   cause_relation  any_of（默认：任一根因解除症状即消失）/ all_of（各根因叠加才致病）
#   first_seen  首次发现日期
#   refs        关联知识页 id

