    note: "Qt-full 5.15.16 全量构建实测含 libQt5Charts.so；Qt6 本机 beta3 安装缺失（与 qt6-status 'Charts 全在' 论断不符，以安装器组件勾选为准——2026-09-09 核）"
    ref: semantic/qt-harmonyos-qt6-status.md
  datavisualization:
    qt5_12: out-of-scope
    qt5_15: out-of-scope
    qt6_12: restricted
    note: "Qt6 本机 beta3 安装缺失（与 qt6-status 'DataVisualization 全在' 论断不符——2026-09-09 核）；依赖 Charts 类组件时先确认 kit 实际内容"
    ref: semantic/qt-harmonyos-qt6-status.md
  core5compat:
    qt5_12: out-of-scope
    qt5_15: out-of-scope
