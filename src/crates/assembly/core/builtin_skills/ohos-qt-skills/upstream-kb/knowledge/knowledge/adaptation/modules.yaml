  webkit:
    qt5_12: out-of-scope
    qt5_15: out-of-scope
    qt6_12: out-of-scope
    substitute: "CEF for OpenHarmony"
    ref: procedural/qt-cef-ohos-dev-guide.md
  webview:
    qt5_12: restricted
    qt5_15: restricted
    qt6_12: out-of-scope
    note: "Qt-full 全量构建实测含 libQt5WebView.so；官方 SDK 状态待核。轻量展示用原生桥；完整内核用 CEF"
    ref: procedural/qt-cef-ohos-dev-guide.md
  dbus:
    qt5_12: out-of-scope
    qt5_15: out-of-scope
    qt6_12: out-of-scope
    note: "HarmonyOS 无 D-Bus；软总线/Ability 机制替代"
    ref: problems/runtime-fail-libqtdbus-missing.md
  remoteobjects:
    qt5_12: out-of-scope
    qt5_15: out-of-scope
    qt6_12: available
    note: "Qt6 beta3 实测含 libQt6RemoteObjects.so（2026-09-09）；Qt5 不含"
    ref: semantic/qt-harmonyos-qt6-status.md
  serialbus:
