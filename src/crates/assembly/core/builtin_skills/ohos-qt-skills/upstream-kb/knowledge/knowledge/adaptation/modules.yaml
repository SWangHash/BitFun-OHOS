    qt5_12: available
    qt5_15: available
    qt6_12: available
  xml:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  test:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  opengl:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  openglextensions:
    qt5_12: restricted
    qt5_15: restricted
    qt6_12: restricted
    note: "多数发行为静态/头文件模块，无独立 .so（2026-09-09 实测 Qt-full 5.15.16 与 Qt6 beta3 均无 libQt*OpenGLExtensions.so）"
    ref: semantic/qt-harmonyos-modules.md
  printsupport:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  svg:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  qml:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  quick:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  quickwidgets:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  quickcontrols2:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  quicktest:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  ohosextras:
    qt5_12: available
    qt5_15: available
    qt6_12: restricted
    note: "Qt6 重新独立为 HarmonyExtras，公开头仅 exports/version 桩，功能头私有 _p.h"
    ref: semantic/qt-ohos-extras.md
  docgallery:
    qt5_12: available
    qt5_15: out-of-scope
    qt6_12: out-of-scope
  uitools:
    qt5_12: self-compile
    qt5_15: self-compile
    qt6_12: available
    note: "qttools 依赖只能在鸿蒙PC上主机编译（host build），Windows 交叉编译不可行"
    ref: problems/build-missing-qt5uitools-ohos.md
  help:
    qt5_12: self-compile
    qt5_15: self-compile
    qt6_12: available
    note: "Qt5 同 uitools 需鸿蒙PC主机编译；Qt6 beta3 实测含 libQt6Help.so（2026-09-09）"
    ref: problems/build-missing-qt5uitools-ohos.md
  multimedia:
    qt5_12: self-compile
    qt5_15: self-compile
    qt6_12: available
    note: "官方 Qt5 SDK 不含（modules 页）；Qt-full 全量构建实测含 libQt5Multimedia.so；Qt6 beta3 实测含"
    ref: semantic/qt-harmonyos-modules.md
  multimediawidgets:
    qt5_12: self-compile
    qt5_15: self-compile
    qt6_12: available
    ref: semantic/qt-harmonyos-modules.md
  pdf:
    qt5_12: out-of-scope
    qt5_15: restricted
    qt6_12: out-of-scope
    note: "仅 5.15 部分支持；Qt6 预构建不含"
    ref: semantic/qt-harmonyos-modules.md
  quicktimeline:
    qt5_12: out-of-scope
    qt5_15: restricted
    qt6_12: available
    note: "Qt6 beta3 实测含 libQt6QuickTimeline.so（2026-09-09）"
    ref: semantic/qt-harmonyos-qt6-status.md
  webengine:
    qt5_12: out-of-scope
    qt5_15: out-of-scope
    qt6_12: out-of-scope
