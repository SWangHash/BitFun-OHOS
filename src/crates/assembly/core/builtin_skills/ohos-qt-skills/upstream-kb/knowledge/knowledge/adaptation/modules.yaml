# knowledge/adaptation/modules.yaml — Qt 模块可用性矩阵（机器可读）
#
# 单一事实源：semantic/qt-harmonyos-modules.md + semantic/qt-harmonyos-qt6-status.md
# 本文件是其机器投影，供 qt-ohos-run.py assess / plan 消费；修改时与人类页同步。
# 模块名一律小写、去版本前缀（scanner 输出口径：core/gui/widgets/...）。
#
# status 取值：
#   available    — SDK 内置，直接可用
#   self-compile — 不在 SDK，需自行交叉编译（不必然阻断）
#   out-of-scope — 平台不支持（核心依赖即阻断）
#   restricted   — 部分支持/能力受限，需逐项验证
#
# 基准：Qt 5.12.12 (tqtc/harmonyos-5.12.12, 613336de) / Qt 5.15.16 (962aa625)
#       Qt 6.12.0 预构建安装器（2026-07-25 复核）

schema: 1
updated: 2026-09-08
source: semantic/qt-harmonyos-modules.md

versions:
  qt5_12: "5.12.12"
  qt5_15: "5.15.16"
  qt6_12: "6.12.0"

modules:
  core:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  gui:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  widgets:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  network:
    qt5_12: available
    qt5_15: available
    qt6_12: available
