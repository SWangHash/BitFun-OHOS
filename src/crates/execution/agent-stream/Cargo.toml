[package]
name = "bitfun-agent-stream"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Lightweight agent stream processing for BitFun"

[lib]
name = "bitfun_agent_stream"
crate-type = ["rlib"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bitfun-events = { path = "../../contracts/events" }
bitfun-core-types = { path = "../../contracts/core-types" }
futures = { workspace = true }
# Tool-call JSON repair keeps the product fork: its `repair_tool_call_json`
# profile does not treat `#`, `//` or `/* */` as comments, so Markdown content
# with a missing opening quote is no longer silently dropped. See
# ../tool-call-jsonrepair/README.md; revisit when upstream jsonrepair-rs can
# express the same profile.
bitfun-tool-call-jsonrepair = { path = "../tool-call-jsonrepair" }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
bitfun-agent-tools = { path = "../tool-contracts" }
tokio-stream = { workspace = true }

[lints]
workspace = true
