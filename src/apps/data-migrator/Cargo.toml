[package]
name = "bitfun-data-migrator"
version = "0.1.1"
authors.workspace = true
edition.workspace = true
description = "BitFun offline legacy data migrator"

[lib]
name = "bitfun_data_migrator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bitfun-data-migrator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
bitfun-legacy-migration-adapters = { path = "../../crates/services/legacy-migration-adapters" }
bitfun-core-types = { path = "../../crates/contracts/core-types" }
bitfun-legacy-migration = { path = "../../crates/services/legacy-migration" }
bitfun-product-domains = { path = "../../crates/contracts/product-domains", features = ["legacy-migration"] }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
