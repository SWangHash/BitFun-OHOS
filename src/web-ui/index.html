    <script>
      (function () {
        var m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        var root = document.documentElement;
        var startupI18n = JSON.parse(document.getElementById('bitfun-startup-i18n').textContent);
        var localeAliases = startupI18n.locales.flatMap(function (locale) {
          return locale.aliases.map(function (alias) {
            return { id: locale.id, alias: alias.toLowerCase() };
          });
        }).sort(function (a, b) { return b.alias.length - a.alias.length; });
        function resolveLocale(value) {
          var injected = window.__BITFUN_BOOTSTRAP_LOCALE__;
          var lang = value || (typeof injected === 'string' && injected ? injected : navigator.language);
          var normalized = (lang || '').trim().toLowerCase();
          var match = localeAliases.find(function (entry) {
            return normalized === entry.alias || normalized.startsWith(entry.alias + '-');
          });
          return match ? match.id : startupI18n.defaultLocale;
        }
        function resolveMessages(value) {
          var locale = resolveLocale(value);
          return startupI18n.locales.find(function (entry) { return entry.id === locale; }).messages;
        }
        window.__BITFUN_RESOLVE_BOOTSTRAP_MESSAGES__ = resolveMessages;
        window.__BITFUN_RESOLVE_BOOTSTRAP_LOCALE__ = resolveLocale;
        window.__BITFUN_STARTUP_OVERLAY_STARTED_AT__ = performance.now();
        root.setAttribute('lang', resolveLocale());
        root.setAttribute('data-bitfun-design-system-root', '');
        if (!root.hasAttribute('data-color-scheme')) {
          root.setAttribute('data-color-scheme', m && m.matches ? 'dark' : 'light');
        }
        root.setAttribute('data-contrast', 'standard');
        root.setAttribute('data-density', 'compact');
        // The HarmonyOS build of the Rust host reports `target_os = "linux"`
        // (its target is `aarch64-unknown-linux-ohos`), so the desktop-Linux
        // client-frame contract can reach this page. Answering it repaints the
        // startup sheet with the theme surface tone and rounds the shell to 12px,
        // which showed up as the launch canvas switching from the start-window
        // black to the app theme color before the splash was dropped. The ArkUI
        // host owns a square native frame, so the contract never applies here and
        // the attribute is dropped before the launch styles resolve.
        // The fingerprint mirrors isOpenHarmonyRuntime() in
        // src/infrastructure/runtime/environment.ts (this script cannot import);
        // the startup script at the end of the body reuses the published result.
        window.__BITFUN_IS_OHOS_HOST__ = /(?:openharmony|harmonyos|ohos)/i.test(
          (navigator.userAgent || '') + ' ' + (navigator.platform || '')
        );
        if (window.__BITFUN_IS_OHOS_HOST__) {
          root.removeAttribute('data-bitfun-native-frame');
        }
        // The shell owns the window frame background when the desktop bootstrap
        // advertises a client-side frame; painting it here would cover the
        // transparent corners.
        var bg = root.getAttribute('data-bitfun-native-frame') === 'client'
          ? 'transparent'
          : (root.style.backgroundColor || 'var(--bitfun-color-surface-chrome)');
        root.style.backgroundColor = bg;
        function paintBody() {
          if (document.body) document.body.style.backgroundColor = bg;
        }
        paintBody();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', paintBody);
        } else {
          paintBody();
        }
      })();
    </script>

    <!-- BITFUN_FONT_PROFILE_STYLESHEET -->
    <style>
      @layer bitfun.tokens.system, bitfun.tokens.theme, bitfun.reset, bitfun.base, bitfun.components, bitfun.overrides;

      @layer bitfun.reset {
        *,
        *::before,
        *::after {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      
      html {
        background-color: var(--bitfun-color-surface-chrome);
      }
      
      body {
        background-color: inherit;
      }

      #root,
      #bitfun-startup-overlay {
        width: 100%;
        height: 100%;
      }

      /* WebKitGTK keeps the GTK frame square on Wayland, so the shell owns the
         frame radius and stands on a transparent window. */
      html[data-bitfun-native-frame='client'],
      html[data-bitfun-native-frame='client'] body {
        background-color: transparent;
      }

      html[data-bitfun-native-frame='client'] #root,
      html[data-bitfun-native-frame='client'] #bitfun-startup-overlay {
        border-radius: 12px;
      }

      /* The startup overlay paints its own translucent sheet; keep the same frame
         shape and stop it from dimming the desktop behind the window. */
      html[data-bitfun-native-frame='client'] .splash-screen {
        border-radius: 12px;
        background: var(--bitfun-color-surface-chrome);
      }

      #bitfun-startup-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
      }

      /* Keep the mounting shell from showing through or doubling the tint.
         Preserve layout so startup readiness and measurements still complete. */
      #root:has(+ #bitfun-startup-overlay:not(.bitfun-startup-overlay--exiting)) {
        visibility: hidden;
      }

      /* The startup mark owns the visible pixels until the handoff completes. */
      #root:has(+ #bitfun-startup-overlay) [data-startup-logo-target],
      #root:has(+ #bitfun-startup-overlay) [data-startup-reveal] {
        opacity: 0;
      }

      #root:has(+ .bitfun-startup-overlay--exiting) [data-startup-reveal] {
        animation: bitfun-startup-content-enter 0.2s ease-out both;
      }

      #root:has(+ .bitfun-startup-overlay--handoff) [data-startup-reveal] {
        animation-duration: 0.24s;
        animation-delay: 0.18s;
      }

      .bitfun-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* The launch canvas is a fixed black brand surface. It must not follow the
         resolved appearance: the splash is painted while the window is being
         revealed, before the saved appearance is guaranteed to be applied, and
         a light appearance would otherwise flash a light launch screen. It is
         the same constant-canvas pattern as the OpenHarmony brand splash. */
      .splash-screen {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        color: rgba(255, 255, 255, 0.72);
        font-family: var(--bitfun-font-family-sans);
        font-size: 13px;
        pointer-events: none;
      }

      @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
        .splash-screen {
          background: var(--bitfun-color-surface-chrome);
        }
      }

      #bitfun-startup-overlay.bitfun-startup-overlay--exiting {
        animation: bitfun-startup-overlay-exit 0.2s ease-in-out both;
      }

      #bitfun-startup-overlay.bitfun-startup-overlay--handoff {
        animation: none;
      }

      #bitfun-startup-overlay.bitfun-startup-overlay--interrupted {
        animation: bitfun-startup-overlay-exit 0.12s ease-out both;
      }

      .bitfun-startup-overlay--handoff .splash-screen {
        animation: bitfun-startup-overlay-exit 0.32s ease-in-out both;
      }

      .bitfun-startup-overlay--handoff .splash-screen__message {
        animation: bitfun-startup-overlay-exit 0.08s ease-out both;
      }

      .window-controls.bitfun-startup-window-controls {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 2;
        height: var(--bitfun-layout-toolbar-md-height);
        pointer-events: auto;
      }

      .bitfun-startup-window-controls[hidden] {
        display: none;
      }

      .splash-screen__center {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash-screen__logo-wrap {
        position: relative;
        width: 120px;
        height: 120px;
        animation: splash-logo-idle 3.2s ease-in-out infinite;
        -webkit-animation: splash-logo-idle 3.2s ease-in-out infinite;
        will-change: transform;
      }

      .splash-screen__logo,
      .bitfun-preload__logo {
        display: block;
        position: absolute;
        top: 50%;
        left: 50%;
        width: 120px;
        height: 120px;
        /* Pinned to the launch mark tone: on the black canvas the mark is always
           "content on dark", never the resolved scheme's mark tone. */
        background-color: var(--bitfun-color-content-on-dark);
        transform: translate(-50%, -50%);
        -webkit-mask: url('/brand/bitfun-mark.svg') center / contain no-repeat;
        mask: url('/brand/bitfun-mark.svg') center / contain no-repeat;
        user-select: none;
        -webkit-user-select: none;
      }

      /* OpenHarmony brand splash: mirror the native start window so the
         handoff from startWindowBackground to the webview is seamless.
         start_window_background is pinned to black in the OHOS resources (base
         and dark) and the launch mark is a single light silhouette, so this
         overlay reuses the shared black launch canvas and only pins the mark to
         the native start-window icon size with no idle animation. It must not
         depend on prefers-color-scheme, which can diverge from the
         AbilityMgr-drawn system start window (see the OHOS entry color.json and
         oh-rs-ability/.../DefaultXComponent.ets). */
      .splash-screen--ohos-brand .splash-screen__logo-wrap {
        animation: none;
        -webkit-animation: none;
        will-change: auto;
      }

      .splash-screen--ohos-brand .bitfun-preload__logo {
        /* The inline script overrides this variable with the native start
           window's physical icon size (240px / devicePixelRatio, clamped to
           the viewport). */
        width: var(--bitfun-ohos-start-icon-size, 120px);
        height: var(--bitfun-ohos-start-icon-size, 120px);
      }

      .splash-screen__message {
        position: absolute;
        top: calc(100% + 16px);
        left: 50%;
        min-width: 220px;
        max-width: min(360px, calc(100vw - 48px));
        color: color-mix(in srgb, var(--bitfun-color-content-on-dark) 72%, transparent);
        font-family: var(--bitfun-type-label-md-font-family);
        font-size: var(--bitfun-type-label-md-font-size);
        font-weight: var(--bitfun-type-label-md-font-weight);
        line-height: var(--bitfun-type-label-md-line-height);
        letter-spacing: var(--bitfun-type-label-md-letter-spacing);
        text-align: center;
        opacity: 0;
        transform: translate(-50%, -2px);
        transition:
          opacity var(--bitfun-motion-duration-base) var(--bitfun-motion-easing-decelerate),
          transform var(--bitfun-motion-duration-base) var(--bitfun-motion-easing-decelerate);
        pointer-events: none;
      }

      .splash-screen__message--visible {
        opacity: 1;
        transform: translate(-50%, 0);
        animation: splash-message-breathe 3.6s ease-in-out var(--bitfun-motion-duration-base) infinite;
      }

      @keyframes splash-message-breathe {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.68;
        }
      }

      @keyframes splash-logo-idle {
        0%, 100% {
          transform: scale(0.99);
        }
        50% {
          transform: scale(1);
        }
      }

      @keyframes bitfun-startup-overlay-exit {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      @keyframes bitfun-startup-content-enter {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        #bitfun-startup-overlay.bitfun-startup-overlay--exiting,
        #root:has(+ .bitfun-startup-overlay--exiting) [data-startup-reveal] {
          animation-duration: 0.12s;
          animation-delay: 0s;
        }

        .splash-screen__logo-wrap {
          animation: none;
        }

        .splash-screen__message {
          animation: none;
          transition: none;
        }
      }

      .bitfun-pet-preload-body,
      .bitfun-desktop-card-preload-body {
        background: transparent !important;
      }

      .bitfun-pet-preload-body #root,
      .bitfun-desktop-card-preload-body #root {
        background: transparent;
      }

      .bitfun-pet-preload {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: transparent;
        pointer-events: none;
      }

      .bitfun-pet-preload__sprite {
        position: relative;
        width: 48px;
        height: 48px;
        transform-origin: center bottom;
        animation: bitfun-pet-preload-breathe 1.8s ease-in-out infinite;
      }

      @keyframes bitfun-pet-preload-breathe {
        0%, 100% {
          opacity: 0.58;
          transform: scale(0.96);
        }
        50% {
          opacity: 0.92;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bitfun-pet-preload__sprite {
          animation: none;
        }
      }
    </style>
    <!-- Creative overrides are activated by the runtime after the shell renders. -->
  </head>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var isPetWindow = params.get('bitfunWindow') === 'agent-companion';
        var isDesktopCardWindow = params.get('bitfunWindow') === 'desktop-card';
        var messages = window.__BITFUN_RESOLVE_BOOTSTRAP_MESSAGES__();
        var locale = window.__BITFUN_RESOLVE_BOOTSTRAP_LOCALE__();
        var startupOverlay = document.getElementById('bitfun-startup-overlay');
        document.documentElement.setAttribute('lang', locale);

        if (isPetWindow) {
          document.body.classList.add('bitfun-pet-preload-body');
          if (startupOverlay) startupOverlay.remove();
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = '<div class="bitfun-pet-preload"><div class="bitfun-pet-preload__sprite" aria-hidden="true"></div><span class="bitfun-sr-only"></span></div>';
            var petStatus = root.querySelector('.bitfun-sr-only');
            if (petStatus) petStatus.textContent = messages.petLoading;
          }
          return;
        }

        // OpenHarmony keeps the native start window visible until the webview
        // paints, so the static splash mirrors it exactly: the same black canvas
        // and light mark, with the mark pinned to the native start-window icon
        // size and no idle animation. The overlay stays mounted until the shell
        // hands off and is then dropped in one frame (see the instant-exit class
        // below); the loading hint stays off because the OHOS host draws its own
        // launch copy. The host fingerprint was resolved by the head script, which
        // also drops the desktop-Linux client-frame contract on this host.
        var isOhosHost = window.__BITFUN_IS_OHOS_HOST__ === true;
        if (isOhosHost) {
          var ohosSplash = document.querySelector('.splash-screen');
          if (ohosSplash) ohosSplash.classList.add('splash-screen--ohos-brand');
          // The document itself carries the launch canvas color for the whole
          // startup. The React shell paints its own opaque surface, so this color
          // is only ever visible in the gap between dropping the launch overlay and
          // the shell's first paint — and that gap must be the launch black. With
          // the theme surface color there (`--bitfun-color-surface-chrome`, which
          // the first script seeds from the color scheme) the gap showed up as a
          // white frame on a light theme and stayed invisible on a dark one.
          // `important` keeps the appearance runtime and the early body paint below
          // from replacing it. Windows that own a transparent page (desktop cards)
          // keep the shared behavior.
          if (!isDesktopCardWindow) {
            document.documentElement.style.setProperty('background-color', '#000000', 'important');
            if (document.body) {
              document.body.style.setProperty('background-color', '#000000', 'important');
            }
          }
          // The launch surface stays one constant icon on one constant background
          // for the whole load, then leaves. It must never fade: the shell behind
          // it is light, so an exit fade reads as the launch background turning
          // white before the app is actually up. hideStartupOverlay() takes this
          // class as "remove the layer in one frame".
          if (startupOverlay) {
            startupOverlay.classList.add('bitfun-startup-overlay--instant-exit');
          }
          // Mirror the native start window draw rule: the icon is scaled by
          // min(winW/iconW, winH/iconH) and never scaled up, i.e. it covers
          // min(240, winW, winH) physical pixels. Convert to CSS px by the
          // devicePixelRatio so the overlay mark lands on the same area as the
          // ArkUI splash mirror and the system start window.
          var ohosDpr = window.devicePixelRatio > 0 ? window.devicePixelRatio : 1;
          var ohosIconPx = 240 / ohosDpr;
          var ohosViewport = Math.min(window.innerWidth || Infinity, window.innerHeight || Infinity);
          if (ohosViewport < ohosIconPx) ohosIconPx = ohosViewport;
          document.documentElement.style.setProperty(
            '--bitfun-ohos-start-icon-size',
            ohosIconPx + 'px'
          );
          // Tell the OHOS shell when the brand overlay has actually been
          // presented: wait until the mark asset is decoded, then double
          // requestAnimationFrame so at least one frame with the overlay has
          // been committed. The native shell matches this token in its
          // onConsole handler and releases the splash mirror exactly on the
          // takeover frame instead of on a load event (a load event can fire
          // while the webview still shows no content, which read as a flash
          // between the mirror and the overlay).
          var signalOverlayPresented = function () {
            var raf = window.requestAnimationFrame;
            if (typeof raf === 'function') {
              raf(function () {
                raf(function () {
                  console.info('bitfun-startup-overlay-presented');
                });
              });
            } else {
              console.info('bitfun-startup-overlay-presented');
            }
          };
          // The overlay mark is a CSS mask over /brand/bitfun-mark.svg; preload
          // that same asset so the takeover frame is guaranteed to have it, then
          // signal on both load and error so a missing asset cannot strand the
          // native splash mirror.
          var ohosMarkPreload = new Image();
          ohosMarkPreload.onload = signalOverlayPresented;
          ohosMarkPreload.onerror = signalOverlayPresented;
          ohosMarkPreload.src = '/brand/bitfun-mark.svg';
          return;
        }

        if (isDesktopCardWindow) {
          document.body.classList.add('bitfun-desktop-card-preload-body');
          if (startupOverlay) startupOverlay.remove();
          return;
        }

        var hint = document.querySelector('.splash-screen__message');
        var controls = document.querySelector('[data-startup-window-controls]');
        function setButtonLabel(button, label) {
          if (!button) return;
          button.setAttribute('aria-label', label);
          button.setAttribute('title', label);
        }
        function applyStartupLabels() {
          if (hint) hint.textContent = messages.loadingApp;
          if (!controls) return;
          var isMaximized = controls.getAttribute('data-bitfun-state') === 'maximized';
          var labels = {
            minimize: messages.minimize,
            toggle_maximize: isMaximized ? messages.restore : messages.maximize,
            close: messages.close
          };
          controls.querySelectorAll('[data-startup-window-action]').forEach(function (button) {
            setButtonLabel(button, labels[button.getAttribute('data-startup-window-action')]);
          });
        }
        applyStartupLabels();

        // The app may resolve its saved locale after the native bootstrap.
        var localeObserver = new MutationObserver(function () {
          messages = window.__BITFUN_RESOLVE_BOOTSTRAP_MESSAGES__(document.documentElement.lang);
          applyStartupLabels();
        });
        localeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
        window.addEventListener('bitfun:startup-overlay-hidden', function () {
          localeObserver.disconnect();
        }, { once: true });

        if (hint) {
          window.setTimeout(function () {
            hint.classList.add('splash-screen__message--visible');
          }, 1200);
        }

        if (controls && window.__BITFUN_SHOW_STARTUP_WINDOW_CONTROLS__) {
          var isWindows = (
            (typeof navigator.userAgent === 'string' && navigator.userAgent.toUpperCase().includes('WINDOWS'))
            || (typeof navigator.platform === 'string' && navigator.platform.toUpperCase().includes('WIN'))
          );
          controls.classList.toggle('window-controls--windows', isWindows);
          controls.querySelectorAll('[data-startup-window-control-platform]').forEach(function (glyph) {
            if (glyph.getAttribute('data-startup-window-control-platform') !== (isWindows ? 'windows' : 'generic')) {
              glyph.remove();
            } else {
              glyph.removeAttribute('data-startup-window-control-platform');
            }
          });
          controls.hidden = false;
        }
        var tauri = window.__TAURI_INTERNALS__;
        var stateRequestVersion = 0;
        var maximizeButton = controls && controls.querySelector('[data-startup-window-action="toggle_maximize"]');
        function applyWindowState(response) {
          if (!controls || !response || typeof response.isMaximized !== 'boolean') return;
          var isMaximized = response.isMaximized;
          if (isMaximized) {
            controls.setAttribute('data-bitfun-state', 'maximized');
          } else {
            controls.removeAttribute('data-bitfun-state');
          }
          setButtonLabel(maximizeButton, isMaximized ? messages.restore : messages.maximize);
          if (maximizeButton) {
            maximizeButton.querySelectorAll('[data-startup-window-control-state]').forEach(function (glyph) {
              glyph.style.display = glyph.getAttribute('data-startup-window-control-state') === (isMaximized ? 'maximized' : 'normal') ? '' : 'none';
            });
          }
        }
        function invokeWindowControl(action) {
          if (!tauri || typeof tauri.invoke !== 'function') return;
          var requestVersion = ++stateRequestVersion;
          tauri.invoke('startup_window_control', { request: { action: action } })
            .then(function (response) {
              if (requestVersion === stateRequestVersion) applyWindowState(response);
            })
            .catch(function () {});
        }

        // The pre-React shell cannot use the runtime adapter yet. Match its
        // live native-state guard instead of exposing an unchecked Tauri drag region.
        var currentWindow = tauri && tauri.metadata && tauri.metadata.currentWindow;
        if (startupOverlay && tauri && typeof tauri.invoke === 'function'
          && currentWindow && typeof currentWindow.label === 'string') {
          var windowLabel = currentWindow.label;
          function canUseStartupWindowGesture(event) {
            return !event.defaultPrevented && event.button === 0
              && event.target === startupOverlay && startupOverlay.isConnected
              && !startupOverlay.hasAttribute('inert');
          }
          startupOverlay.addEventListener('mousedown', function (event) {
            if (!canUseStartupWindowGesture(event) || event.detail > 1) return;
            Promise.all([
              tauri.invoke('plugin:window|is_maximized', { label: windowLabel }),
              tauri.invoke('plugin:window|is_fullscreen', { label: windowLabel })
            ]).then(function (states) {
              if (states[0] !== false || states[1] !== false
                || !startupOverlay.isConnected || startupOverlay.hasAttribute('inert')) return;
              return tauri.invoke('plugin:window|start_dragging', { label: windowLabel });
            }).catch(function () {});
          });
          startupOverlay.addEventListener('dblclick', function (event) {
            if (!canUseStartupWindowGesture(event)) return;
            invokeWindowControl('toggle_maximize');
          });
        }

        if (controls && window.__BITFUN_SHOW_STARTUP_WINDOW_CONTROLS__) {
          controls.querySelectorAll('[data-startup-window-action]').forEach(function (button) {
            var action = button.getAttribute('data-startup-window-action');
            button.addEventListener('click', function (event) {
              event.preventDefault();
              event.stopPropagation();
              invokeWindowControl(action);
            });
          });
          invokeWindowControl('get_state');
          window.setTimeout(function () {
            if (controls.isConnected) invokeWindowControl('get_state');
          }, 120);
        }
      })();
    </script>
  </body>
</html>
