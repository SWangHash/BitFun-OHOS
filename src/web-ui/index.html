<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/bitfun-app-icon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/bitfun-app-icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/bitfun-app-icon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BitFun - AI Code Assistant</title>
    <!-- BITFUN_STARTUP_I18N_START -->
    <!-- This block is generated by scripts/generate-i18n-contract.mjs from Web UI common locale resources. -->
    <script id="bitfun-startup-i18n" type="application/json">
      {
        "schemaVersion": 1,
        "defaultLocale": "zh-CN",
        "locales": [
          {
            "id": "zh-CN",
            "aliases": [
              "zh",
              "zh-Hans",
              "zh-CN"
            ],
            "messages": {
              "loadingApp": "正在启动 BitFun...",
              "minimize": "最小化",
              "maximize": "最大化",
              "restore": "还原",
              "close": "关闭",
              "petLoading": "正在加载助手..."
            }
          },
          {
            "id": "en-US",
            "aliases": [
              "en",
              "en-US"
            ],
            "messages": {
              "loadingApp": "Starting BitFun...",
              "minimize": "Minimize",
              "maximize": "Maximize",
              "restore": "Restore",
              "close": "Close",
              "petLoading": "Loading companion..."
            }
          },
          {
            "id": "zh-TW",
            "aliases": [
              "zh-TW",
              "zh-Hant",
              "zh-HK",
              "zh-MO"
            ],
            "messages": {
              "loadingApp": "正在啟動 BitFun...",
              "minimize": "最小化",
              "maximize": "最大化",
              "restore": "還原",
              "close": "關閉",
              "petLoading": "正在載入助手..."
            }
          }

    <!-- BITFUN_STARTUP_I18N_END -->
    <script>
      (function () {
        var m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        var root = document.documentElement;
        var startupI18n = JSON.parse(document.getElementById('bitfun-startup-i18n').textContent);
        var localeAliases = startupI18n.locales.flatMap(function (locale) {
          return locale.aliases.map(function (alias) {
            return { id: locale.id, alias: alias.toLowerCase() };
          });
        }).sort(function (a, b) { return b.alias.length - a.alias.length; });
        function resolveLocale(value) {
          var injected = window.__BITFUN_BOOTSTRAP_LOCALE__;
          var lang = value || (typeof injected === 'string' && injected ? injected : navigator.language);
          var normalized = (lang || '').trim().toLowerCase();
          var match = localeAliases.find(function (entry) {
            return normalized === entry.alias || normalized.startsWith(entry.alias + '-');
          });
          return match ? match.id : startupI18n.defaultLocale;
        }
        function resolveMessages(value) {
          var locale = resolveLocale(value);
          return startupI18n.locales.find(function (entry) { return entry.id === locale; }).messages;
        }
        window.__BITFUN_RESOLVE_BOOTSTRAP_MESSAGES__ = resolveMessages;
        window.__BITFUN_RESOLVE_BOOTSTRAP_LOCALE__ = resolveLocale;
        window.__BITFUN_STARTUP_OVERLAY_STARTED_AT__ = performance.now();
        root.setAttribute('lang', resolveLocale());
        root.setAttribute('data-bitfun-design-system-root', '');
        if (!root.hasAttribute('data-color-scheme')) {
          root.setAttribute('data-color-scheme', m && m.matches ? 'dark' : 'light');
        }
        root.setAttribute('data-contrast', 'standard');
        root.setAttribute('data-density', 'compact');
        var bg = root.style.backgroundColor || 'var(--bitfun-color-surface-chrome)';
        root.style.backgroundColor = bg;
        function paintBody() {
          if (document.body) document.body.style.backgroundColor = bg;
        }
        paintBody();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', paintBody);
        } else {
          paintBody();
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/design-system-theme.css" />
    <!-- The shell window controls are styled from here so the pre-React document
         and the app chrome share one stylesheet instance. -->
    <link rel="stylesheet" href="/src/app/components/WindowControls/WindowControls.scss" />
    <!-- BITFUN_FONT_PROFILE_STYLESHEET -->
    <style>
      @layer bitfun.tokens.system, bitfun.tokens.theme, bitfun.reset, bitfun.base, bitfun.components, bitfun.overrides;

      @layer bitfun.reset {
        *,
        *::before,
        *::after {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      
      html {
        background-color: var(--bitfun-color-surface-chrome);
      }
      
      body {
        background-color: inherit;
      }

      #root,
      #bitfun-startup-overlay {
        width: 100%;
        height: 100%;
      }

      #bitfun-startup-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
      }

      .bitfun-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* The launch canvas is a fixed black brand surface. It must not follow the
         resolved appearance: the splash is painted while the window is being
         revealed, before the saved appearance is guaranteed to be applied, and
         a light appearance would otherwise flash a light launch screen. It is
         the same constant-canvas pattern as the OpenHarmony brand splash. */
      .splash-screen {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        color: rgba(255, 255, 255, 0.72);
        font-family: var(--bitfun-font-family-sans);
        font-size: 13px;
        pointer-events: none;
      }

      #bitfun-startup-overlay.bitfun-startup-overlay--exiting {
        animation: bitfun-startup-overlay-exit 0.24s ease-in-out both;
      }

      .splash-screen__center {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash-screen__logo-wrap {
        position: relative;
        width: 120px;
        height: 120px;
        animation: splash-logo-idle 3.2s ease-in-out infinite;
        -webkit-animation: splash-logo-idle 3.2s ease-in-out infinite;
        will-change: transform;
      }

      .splash-screen__logo,
      .bitfun-preload__logo {
        display: block;
        position: absolute;
        top: 50%;
        left: 50%;
        width: 120px;
        height: 120px;
        /* Pinned to the launch mark tone: on the black canvas the mark is always
           "content on dark", never the resolved scheme's mark tone. */
        background-color: var(--bitfun-color-content-on-dark);
        transform: translate(-50%, -50%);
        -webkit-mask: url('/brand/bitfun-mark.svg') center / contain no-repeat;
        mask: url('/brand/bitfun-mark.svg') center / contain no-repeat;
        user-select: none;
        -webkit-user-select: none;
      }

      /* OpenHarmony brand splash: mirror the native start window so the
         handoff from startWindowBackground to the webview is seamless.
         start_window_background is pinned to black in the OHOS resources (base
         and dark) and the launch mark is a single light silhouette, so this
         overlay reuses the shared black launch canvas and only pins the mark to
         the native start-window icon size with no idle animation. It must not
         depend on prefers-color-scheme, which can diverge from the
         AbilityMgr-drawn system start window (see the OHOS entry color.json and
         oh-rs-ability/.../DefaultXComponent.ets). */
      .splash-screen--ohos-brand .splash-screen__logo-wrap {
        animation: none;
        -webkit-animation: none;
        will-change: auto;
      }

      .splash-screen--ohos-brand .bitfun-preload__logo {
        /* The inline script overrides this variable with the native start
           window's physical icon size (240px / devicePixelRatio, clamped to
           the viewport). */
        width: var(--bitfun-ohos-start-icon-size, 120px);
        height: var(--bitfun-ohos-start-icon-size, 120px);
      }

      .splash-screen__message {
        position: absolute;
        top: calc(100% + 16px);
        left: 50%;
        min-width: 220px;
        max-width: min(360px, calc(100vw - 48px));
        color: color-mix(in srgb, var(--bitfun-color-content-on-dark) 72%, transparent);
        font-family: var(--bitfun-type-label-md-font-family);
        font-size: var(--bitfun-type-label-md-font-size);
        font-weight: var(--bitfun-type-label-md-font-weight);
        line-height: var(--bitfun-type-label-md-line-height);
        letter-spacing: var(--bitfun-type-label-md-letter-spacing);
        text-align: center;
        opacity: 0;
        transform: translate(-50%, -2px);
        transition:
          opacity var(--bitfun-motion-duration-base) var(--bitfun-motion-easing-decelerate),
          transform var(--bitfun-motion-duration-base) var(--bitfun-motion-easing-decelerate);
        pointer-events: none;
      }

      .splash-screen__message--visible {
        opacity: 1;
        transform: translate(-50%, 0);
        animation: splash-message-breathe 3.6s ease-in-out var(--bitfun-motion-duration-base) infinite;
      }

      @keyframes splash-message-breathe {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.68;
        }
      }

      @keyframes splash-logo-idle {
        0%, 100% {
          transform: scale(0.99);
        }
        50% {
          transform: scale(1);
        }
      }

      @keyframes bitfun-startup-overlay-exit {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-screen__logo-wrap {
          animation: none;
        }

        .splash-screen__message {
          animation: none;
          transition: none;
        }
      }

      .bitfun-pet-preload-body {
        background: transparent !important;
      }

      .bitfun-pet-preload-body #root {
        background: transparent;
      }

      .bitfun-pet-preload {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: transparent;
        pointer-events: none;
      }

      .bitfun-pet-preload__sprite {
        position: relative;
        width: 48px;
        height: 48px;
        transform-origin: center bottom;
        animation: bitfun-pet-preload-breathe 1.8s ease-in-out infinite;
      }

      @keyframes bitfun-pet-preload-breathe {
        0%, 100% {
          opacity: 0.58;
          transform: scale(0.96);
        }
        50% {
          opacity: 0.92;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bitfun-pet-preload__sprite {
          animation: none;
        }
      }
    </style>
    <!-- Creative overrides are activated by the runtime after the shell renders. -->
  </head>

  <body>
    <script type="module" src="/src/main.tsx"></script>
    <div id="root"></div>
    <div id="bitfun-startup-overlay">
      <div class="splash-screen">
        <div class="splash-screen__center">
          <div class="splash-screen__logo-wrap">
            <span class="bitfun-preload__logo" aria-hidden="true"></span>
          </div>
          <div class="splash-screen__message"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var isPetWindow = params.get('bitfunWindow') === 'agent-companion';
        var messages = window.__BITFUN_RESOLVE_BOOTSTRAP_MESSAGES__();
        var locale = window.__BITFUN_RESOLVE_BOOTSTRAP_LOCALE__();
        document.documentElement.setAttribute('lang', locale);

        if (isPetWindow) {
          document.body.classList.add('bitfun-pet-preload-body');
          var startupOverlay = document.getElementById('bitfun-startup-overlay');
          if (startupOverlay) startupOverlay.remove();
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = '<div class="bitfun-pet-preload"><div class="bitfun-pet-preload__sprite" aria-hidden="true"></div><span class="bitfun-sr-only"></span></div>';
            var petStatus = root.querySelector('.bitfun-sr-only');
            if (petStatus) petStatus.textContent = messages.petLoading;
          }
          return;
        }

        // OpenHarmony keeps the native start window visible until the webview
        // paints, so the static splash mirrors it exactly: the same black canvas
        // and light mark, with the mark pinned to the native start-window icon
        // size and no idle animation. The overlay stays mounted and is faded out
        // by hideStartupOverlay() as on desktop; the loading hint stays off
        // because the OHOS host draws its own launch copy.
        // The fingerprint mirrors isOpenHarmonyRuntime() in
        // src/infrastructure/runtime/environment.ts (this script cannot import).
        var isOhosHost = /(?:openharmony|harmonyos|ohos)/i.test(
          (navigator.userAgent || '') + ' ' + (navigator.platform || '')
        );
        if (isOhosHost) {
          var ohosSplash = document.querySelector('.splash-screen');
          if (ohosSplash) ohosSplash.classList.add('splash-screen--ohos-brand');
          // Mirror the native start window draw rule: the icon is scaled by
          // min(winW/iconW, winH/iconH) and never scaled up, i.e. it covers
          // min(240, winW, winH) physical pixels. Convert to CSS px by the
          // devicePixelRatio so the overlay mark lands on the same area as the
          // ArkUI splash mirror and the system start window.
          var ohosDpr = window.devicePixelRatio > 0 ? window.devicePixelRatio : 1;
          var ohosIconPx = 240 / ohosDpr;
          var ohosViewport = Math.min(window.innerWidth || Infinity, window.innerHeight || Infinity);
          if (ohosViewport < ohosIconPx) ohosIconPx = ohosViewport;
          document.documentElement.style.setProperty(
            '--bitfun-ohos-start-icon-size',
            ohosIconPx + 'px'
          );
          // Tell the OHOS shell when the brand overlay has actually been
          // presented: wait until the mark asset is decoded, then double
          // requestAnimationFrame so at least one frame with the overlay has
          // been committed. The native shell matches this token in its
          // onConsole handler and releases the splash mirror exactly on the
          // takeover frame instead of on a load event (a load event can fire
          // while the webview still shows no content, which read as a flash
          // between the mirror and the overlay).
          var signalOverlayPresented = function () {
            var raf = window.requestAnimationFrame;
            if (typeof raf === 'function') {
              raf(function () {
                raf(function () {
                  console.info('bitfun-startup-overlay-presented');
                });
              });
            } else {
              console.info('bitfun-startup-overlay-presented');
            }
          };
          // The overlay mark is a CSS mask over /brand/bitfun-mark.svg; preload
          // that same asset so the takeover frame is guaranteed to have it, then
          // signal on both load and error so a missing asset cannot strand the
          // native splash mirror.
          var ohosMarkPreload = new Image();
          ohosMarkPreload.onload = signalOverlayPresented;
          ohosMarkPreload.onerror = signalOverlayPresented;
          ohosMarkPreload.src = '/brand/bitfun-mark.svg';
          return;
        }

        // The splash owns no window chrome: minimize/maximize/close belong to the
        // rendered app shell, so they appear together with the interface instead
        // of over the launch canvas.
        var hint = document.querySelector('.splash-screen__message');
        function applyStartupLabels() {
          if (hint) hint.textContent = messages.loadingApp;
        }
        applyStartupLabels();

        // The app may resolve its saved locale after the native bootstrap.
        var localeObserver = new MutationObserver(function () {
          messages = window.__BITFUN_RESOLVE_BOOTSTRAP_MESSAGES__(document.documentElement.lang);
          applyStartupLabels();
        });
        localeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
        window.addEventListener('bitfun:startup-overlay-hidden', function () {
          localeObserver.disconnect();
        }, { once: true });

        if (hint) {
          window.setTimeout(function () {
            hint.classList.add('splash-screen__message--visible');
          }, 1200);
        }
      })();
    </script>
  </body>
</html>
