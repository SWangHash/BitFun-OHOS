<svg width="1600" height="640" viewBox="0 0 1600 640" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans', sans-serif">
  <title>One task, many surfaces: four remote scenarios converging on one BitFun host</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f6fa"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="640" fill="url(#bg)"/>
  <circle cx="1400" cy="90" r="260" fill="url(#glowBlue)"/>
  <circle cx="160" cy="560" r="280" fill="url(#glowPurple)"/>
  <circle cx="900" cy="620" r="200" fill="url(#glowCyan)"/>
  <circle cx="1564" cy="250" r="1.6" fill="#cbd5e1"/>
  <circle cx="60" cy="120" r="1.6" fill="#cbd5e1"/>
  <circle cx="900" cy="160" r="1.6" fill="#cbd5e1"/>
  <circle cx="900" cy="540" r="1.6" fill="#cbd5e1"/>

  <!-- Header -->
  <text x="80" y="98" font-size="40" font-weight="700" fill="#0f172a">One task, many surfaces</text>
  <text x="80" y="136" font-size="19" fill="#5b6b80">The workspace, the runtime, and the person driving it can each sit on a different machine</text>

  <!-- Scenario card 1: Remote workspace -->
  <rect x="80" y="190" width="350" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="128" cy="265" r="28" fill="#0ea5e9" opacity="0.1"/>
  <circle cx="128" cy="265" r="28" fill="none" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="1"/>
  <g transform="translate(110,247) scale(1.5)" fill="none" stroke="#0ea5e9" stroke-width="1.7" stroke-linecap="round">
    <rect x="4" y="4" width="16" height="6.5" rx="1.5"/>
    <rect x="4" y="13.5" width="16" height="6.5" rx="1.5"/>
    <circle cx="7" cy="7.25" r="1" fill="#0ea5e9" stroke="none"/>
    <circle cx="7" cy="16.75" r="1" fill="#0ea5e9" stroke="none"/>
    <path d="M12 7.25 H17" opacity="0.6"/>
    <path d="M12 16.75 H17" opacity="0.6"/>
  </g>
  <text x="172" y="248" font-size="17" font-weight="700" fill="#1e293b">Remote workspace</text>
  <text x="172" y="274" font-size="13" fill="#64748b">Workspace on an SSH host,</text>
  <text x="172" y="295" font-size="13" fill="#64748b">jump chain, or Docker container</text>

  <!-- Scenario card 2: Remote control -->
  <rect x="470" y="190" width="350" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="518" cy="265" r="28" fill="#6366f1" opacity="0.1"/>
  <circle cx="518" cy="265" r="28" fill="none" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1"/>
  <g transform="translate(500,247) scale(1.5)" fill="none" stroke="#6366f1" stroke-width="1.7" stroke-linecap="round">
    <rect x="7" y="3.5" width="9" height="17" rx="2.2"/>
    <path d="M10 6.5 H13"/>
    <path d="M10 17.5 H13"/>
    <path d="M17.5 7.5 A 4.5 4.5 0 0 1 17.5 14.5"/>
    <path d="M15 9.5 A 2.2 2.2 0 0 1 15 12.8" opacity="0.7"/>
  </g>
  <text x="562" y="248" font-size="17" font-weight="700" fill="#1e293b">Remote control</text>
  <text x="562" y="274" font-size="13" fill="#64748b">Mobile web or Feishu / Telegram /</text>
  <text x="562" y="295" font-size="13" fill="#64748b">WeChat bot, through the relay</text>

  <!-- Scenario card 3: Peer Device Mode -->
  <rect x="80" y="370" width="350" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="128" cy="445" r="28" fill="#10b981" opacity="0.1"/>
  <circle cx="128" cy="445" r="28" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
  <g transform="translate(110,427) scale(1.5)" fill="none" stroke="#10b981" stroke-width="1.7" stroke-linecap="round">
    <rect x="3.5" y="7.5" width="9" height="8" rx="1.5"/>
    <rect x="16.5" y="5" width="4.5" height="11" rx="1.2"/>
    <path d="M13.2 11.5 H15.8"/>
    <circle cx="13.2" cy="11.5" r="0.9" fill="#10b981" stroke="none"/>
    <circle cx="15.8" cy="11.5" r="0.9" fill="#10b981" stroke="none"/>
  </g>
  <text x="172" y="428" font-size="17" font-weight="700" fill="#1e293b">Peer Device Mode</text>
  <text x="172" y="454" font-size="13" fill="#64748b">One same-account device becomes</text>
  <text x="172" y="475" font-size="13" fill="#64748b">the data plane of another</text>

  <!-- Scenario card 4: Detached Dispatch -->
  <rect x="470" y="370" width="350" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="518" cy="445" r="28" fill="#f59e0b" opacity="0.1"/>
  <circle cx="518" cy="445" r="28" fill="none" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
  <g transform="translate(500,427) scale(1.5)" fill="none" stroke="#f59e0b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 3.5 L3.5 10.5 L10.5 13.5 L13.5 20.5 Z"/>
    <path d="M21 3.5 L10.5 13.5"/>
  </g>
  <text x="562" y="428" font-size="17" font-weight="700" fill="#1e293b">Detached Dispatch</text>
  <text x="562" y="454" font-size="13" fill="#64748b">Submit a durable job and disconnect;</text>
  <text x="562" y="475" font-size="13" fill="#64748b">the target owns it end to end</text>

  <!-- Connector lines into the host -->
  <g fill="none" stroke-width="2.5" opacity="0.75" stroke-linejoin="round">
    <path d="M255 190 V168 H860 C 950 168, 960 235, 1006 245" stroke="#0ea5e9"/>
    <path d="M820 265 C 890 265, 930 325, 1006 325" stroke="#6366f1"/>
    <path d="M820 445 C 890 445, 930 390, 1006 390" stroke="#f59e0b"/>
    <path d="M255 520 V545 H860 C 950 545, 960 478, 1006 470" stroke="#10b981"/>
  </g>
  <path d="M1006 239.5 L1019 245 L1006 250.5 Z" fill="#0ea5e9"/>
  <path d="M1006 319.5 L1019 325 L1006 330.5 Z" fill="#6366f1"/>
  <path d="M1006 384.5 L1019 390 L1006 395.5 Z" fill="#f59e0b"/>
  <path d="M1006 464.5 L1019 470 L1006 475.5 Z" fill="#10b981"/>

  <!-- Central host card -->
  <rect x="1020" y="195" width="460" height="290" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="1044" y="225" width="412" height="180" rx="12" fill="#0d1424"/>
  <circle cx="1064" cy="243" r="4.5" fill="#ff5f57"/>
  <circle cx="1080" cy="243" r="4.5" fill="#febc2e"/>
  <circle cx="1096" cy="243" r="4.5" fill="#28c840"/>
  <rect x="1064" y="266" width="80" height="8" rx="4" fill="#10b981"/>
  <rect x="1064" y="288" width="190" height="8" rx="4" fill="#38bdf8" opacity="0.85"/>
  <rect x="1064" y="310" width="290" height="8" rx="4" fill="#475569"/>
  <rect x="1064" y="332" width="240" height="8" rx="4" fill="#475569" opacity="0.65"/>
  <rect x="1064" y="354" width="130" height="8" rx="4" fill="#10b981"/>
  <rect x="1204" y="352" width="2.5" height="12" fill="#e2e8f0"/>
  <circle cx="1064" cy="386" r="4" fill="#10b981"/>
  <text x="1076" y="391" font-size="12" fill="#94a3b8" font-family="'Cascadia Mono', 'SF Mono', Consolas, ui-monospace, monospace">task running</text>
  <text x="1044" y="443" font-size="17" font-weight="700" fill="#1e293b">BitFun host</text>
  <text x="1044" y="466" font-size="13" fill="#64748b">session &#183; worktree &#183; event log &#183; permission mailbox</text>

  <!-- Footer caption -->
  <text x="800" y="585" font-size="15" fill="#8b98ac" text-anchor="middle">Every command declares where it may run &#8212; enforced by tests, not hand-kept lists</text>
</svg>
