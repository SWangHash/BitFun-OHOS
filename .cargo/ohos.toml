# OHOS delivery profile: select the OpenHarmony Tauri forks.
#
# The root manifest carries the upstream Windows/macOS Tauri stack in
# `[patch.crates-io]`. That table is workspace-global and cannot be
# target-gated, so OHOS builds opt into the forks by passing this file:
#
#   cargo fetch  --config /workspace/.cargo/ohos.toml
#   cargo check  --target aarch64-unknown-linux-ohos --config /workspace/.cargo/ohos.toml
#
# A `[patch]` entry from the config takes precedence over the manifest entry for
# the same crate, which is what replaces the upstream pins here.
#
# `tauri` and `tauri-build` are the only crates.io Tauri crates the workspace
# depends on directly. The remaining entries keep the fork's own sibling crates
# in place of the upstream revision pins, so no upstream Tauri source can leak
# into an OHOS graph. `wry`/`tao` need no entry: the fork's `tauri-runtime-wry`
# depends on `richerfu/wry` and `richerfu/tao` directly, and the manifest paths
# (third_party/wry, third_party/tao) only patch crates.io sources.
#
# Keep the Windows/macOS stack untouched: do not copy these entries into
# `.cargo/config.toml` or the root manifest.
[patch.crates-io]
tauri = { git = "https://github.com/richerfu/tauri", branch = "feat/open-harmony" }
tauri-build = { git = "https://github.com/richerfu/tauri", branch = "feat/open-harmony" }
tauri-runtime = { git = "https://github.com/richerfu/tauri", branch = "feat/open-harmony" }
tauri-runtime-wry = { git = "https://github.com/richerfu/tauri", branch = "feat/open-harmony" }
tauri-macros = { git = "https://github.com/richerfu/tauri", branch = "feat/open-harmony" }
